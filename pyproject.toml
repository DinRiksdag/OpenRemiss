[project]
name = "openremiss"
version = "0.3.0"
description = "Collect and structure Swedish government consultations and responses."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "liteparse>=2.18",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "rapidfuzz>=3.14.6",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-m 'not quality'"
markers = [
    "quality: manual extraction quality and timing checks against real PDFs",
    "source_exception: verified naming or attachment errors in the source metadata",
]

[tool.ruff]
target-version = "py315"
# Local, untracked PDF experiment with a separate dependency stack.
extend-exclude = ["convertdiarier.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
root = ["."]
python-version = "3.15"

[tool.ty.src]
include = [
    "models.py", "service", "test", "scripts",
    "download_data.py", "build_remissinstans_list.py", "clean_data.py", "audit_names.py",
]
