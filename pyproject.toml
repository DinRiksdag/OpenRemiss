[project]
name = "openremiss"
version = "0.3.0"
description = "Collect and structure Swedish government consultations and responses."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "liteparse>=2.18,<3",
    "pandas>=3.1.1,<4",
    "pyarrow>=26.0.1,<27",
    "pydantic>=2.14.3,<3",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7,<5",
    "pytest==7.3.1",
    "ruff>=0.17.4,<1",
    "ty>=0.0.99,<0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-m 'not quality'"
markers = ["quality: manual extraction quality and timing checks against real PDFs"]

[tool.ruff]
target-version = "py311"
# Local, untracked PDF experiment with a separate dependency stack.
extend-exclude = ["convertdiarier.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
root = ["."]
python-version = "3.11"

[tool.ty.src]
include = [
    "models.py", "service", "test",
    "download_data.py", "build_remissinstans_list.py", "clean_data.py",
]
