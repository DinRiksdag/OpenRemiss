[project]
name = "openremiss"
version = "0.3.0"
description = "Collect and structure Swedish government consultations and responses."
readme = "README.md"
# Keep the legacy dependency stack on a tested Python minor version.
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4==4.12.2",
    "fake-useragent==1.1.3",
    "numpy>=1.23,<2",
    "ocrmypdf==14.1.0",
    "packaging==23.1",
    "pandas>=1.5,<3",
    "pdf2image",
    # OCRmyPDF uses this maintained fork; do not also install pdfminer,
    # which writes to the same Python namespace.
    "pdfminer-six",
    # 8.x provides Apple Silicon wheels and retains OCRmyPDF 14's APIs.
    "pikepdf>=8,<9",
    "pymupdf",
    "rapidfuzz==3.0.0",
    "selenium==4.9.0",
    "sparqlwrapper==2.0.0",
    # Keep the existing ORM APIs until a separate SQLAlchemy upgrade.
    "sqlalchemy>=1.4.54,<2",
    "tabula-py==2.7.0",
    "webdriver-manager==3.8.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7,<5",
    "pytest==7.3.1",
    "ruff>=0.17.4,<1",
    "ty>=0.0.99,<0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# Local, untracked PDF experiment with a separate dependency stack.
extend-exclude = ["convertdiarier.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
root = ["."]
python-version = "3.11"

[tool.ty.src]
include = [
    "database", "service", "test",
    "download_data.py", "build_remissinstans_list.py", "clean_data.py",
]
